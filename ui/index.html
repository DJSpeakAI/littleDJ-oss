<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>little DJ</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=20261113b"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261113b">
<meta name="theme-color" content="#0d0e10">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#0d0e10; --bg2:#111214; --panel:#141517; --card:#17191c; --card2:#1b1e21;
  --line:#26292e; --line2:#31353b;
  --text:#e7e8ea; --sub:#9ba1a8; --faint:#6c727a;
  --accent:#34c98b; --accent-strong:#3ee6a0; --accent-soft:rgba(52,201,139,.13);
  --user:#1a2733; --user-line:#263a4d;
  --warn:#f0b429; --err:#ff6b6b;
  /* 角色色板（task70 S3-3；色值按 S1b 附录 B.2 定案） */
  --role-steward:#7ed5e7; --role-steward-bg:#173036;
  --role-secretariat:#c9a4ea; --role-secretariat-bg:#271636;
  --role-writer:#9aa0f4; --role-writer-bg:#151837;
  --role-censor-ds:#e59ee1; --role-censor-ds-bg:#361734; /* task265 起退役类：仅历史会话渲染兜底 */
  --role-censor-glm:#ee8baf; --role-censor-glm-bg:#361622; /* task265 起退役类：仅历史会话渲染兜底 */
  --role-censor-plan:#e59ee1; --role-censor-plan-bg:#361734; /* task265 角色键去模型名：方案审（沿用原配色零新增 hex） */
  --role-censor-output:#ee8baf; --role-censor-output-bg:#361622; /* task265：产出审（沿用原配色零新增 hex） */
  --role-butler:#e5dfd1; --role-butler-bg:#322a1b;
  --role-aux:#a2b4c3; --role-aux-bg:#1f272d;
  --role-unknown:#a8a8a8; --role-unknown-bg:#2b2b2b;
  --radius:16px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.7 -apple-system,"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
/* task387（modern-web-guidance P1-2）：滚动条标准属性优先，老内核 @supports 兜底；thumb 对 track 对比度 #5e656d vs #0d0e10 ≈3.27:1 过 WCAG 1.4.11 的 3:1（旧 #2b2f35 仅 ≈1.45:1 基本看不见；产出审 P1-2 修正：首版 #545b63 实算 2.81:1 未达标） */
:root{ --sb-thumb:#5e656d; --sb-thumb-hover:#6a7178; --sb-track:#0d0e10; }
html{ scrollbar-color: var(--sb-thumb) var(--sb-track); scrollbar-width: thin; }
@supports not (scrollbar-color: auto){
  html{ scrollbar-width: auto; } /* 必须还原为 auto，否则老内核会整块禁用下面的 ::-webkit-scrollbar，兜底就白写了 */
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:6px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-hover);background-clip:content-box}
  ::-webkit-scrollbar-track{background:var(--sb-track)}
}
/* task387（P2-2）：键盘焦点可见（仅键盘/读屏聚焦出现，鼠标用户无感） */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

#app{display:grid;grid-template-columns:var(--sbw,250px) minmax(0,1fr) var(--rgw,380px);height:100vh;height:100dvh;position:relative;--sbw:250px;--rgw:380px}
#app.noright{grid-template-columns:var(--sbw,250px) minmax(0,1fr) 0}
#app.noright #right{display:none}

/* 三栏宽度拖拽 */
.splitter{position:absolute;top:0;bottom:0;width:9px;z-index:8;cursor:col-resize;touch-action:none}
.splitter::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:transparent;transition:background .15s}
.splitter:hover::after,.splitter.drag::after{background:var(--accent);opacity:.55}
#spLeft{left:calc(var(--sbw,250px) - 4px)}
#spRight{right:calc(var(--rgw,380px) - 5px)}
#app.noright #spRight{display:none}
body.dragging-col{cursor:col-resize;user-select:none}
@media (max-width:940px){.splitter{display:none}}

/* ---------------- sidebar ---------------- */
#sidebar{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:12px 10px;gap:2px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 4px 12px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#38d99a,#1c9c69);color:#07130d;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.3px;box-shadow:0 2px 10px rgba(52,201,139,.25)}
.brand-txt{flex:1;min-width:0}
.brand-txt b{display:block;font-size:14px;line-height:1.25;letter-spacing:.2px}
.brand-txt span{display:block;font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nav{display:flex;flex-direction:row;gap:4px;margin:8px 0 2px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:11px}
.nav button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 4px;border-radius:8px;color:#c3c7cc;text-align:center;font-size:12.5px}
.nav button:hover{background:#1a1c1f;color:var(--text)}
.nav button.active{background:#202327;color:var(--text);font-weight:600}
.nav .ico{color:var(--sub);font-size:13px;flex:none}
.nav .ico svg{width:13px;height:13px;display:block} /* task277：项目页签图标换 SVG 线稿（主人嫌 ▦ 土鳖） */
.nav button.active .ico{color:var(--accent)}
.nav .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sect{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.sect-h{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 4px;font-size:11px;color:var(--faint);letter-spacing:.04em}
.sect-actions{display:flex;align-items:center;gap:2px}
.sect-h button{font-size:13px;color:var(--faint);padding:2px 5px;border-radius:6px}
.sect-h button:hover{color:var(--text);background:#1c1f23}
/* task342：搜索行三条件样式随左栏搜索入口退役删除 */
#navBody{flex:1;overflow:auto;min-height:0;padding:0 0 8px}

.item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:9px;cursor:pointer;border:1px solid transparent;-webkit-user-select:none;user-select:none} /* task192：行密度收紧 7px→5px（边栏内容多，主人要求更紧凑） */
/* 悬停态只挂真指针设备：触屏（手机）touch 后 :hover 会粘滞在旧行上，造成「两个都像选中」（主人 2026-11-09 实拍） */
@media (hover:hover) and (pointer:fine){ .item:hover{background:#1a1c1f} }
/* 选中态=文件管理器风：只变色不动形（accent 淡底+左侧竖条，inset 不占布局） */
.item.active{background:var(--accent-soft);border-color:rgba(52,201,139,.35);box-shadow:inset 2px 0 0 var(--accent)}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.conv-st{font-size:9.5px;padding:0 5px;border-radius:999px;flex:none;line-height:1.6;white-space:nowrap}
.conv-st.on{color:var(--accent);background:var(--accent-soft)}
.conv-st.off{color:var(--faint);background:var(--card2)}
/* task190：状态标签分色——执行中绿 / 空闲中蓝 / 已完成淡紫（色值全部复用已有色，零新增 hex；.idle/.done 排在 .off 之后覆盖）
   task199（主人 2026-11-10 定）：已完成由灰改淡紫——灰既不够「完成感」也压不住视线，淡紫与蓝/绿/黄/红/灰五色区分度最高且柔和不刺眼；
   色值复用 --role-secretariat（#c9a4ea），底 rgba 由同色值派生（与 .idle/.wait 低透明底同构）。 */
.conv-st.run{color:var(--accent);background:var(--accent-soft)}
.conv-st.idle{color:#7cb3ff;background:rgba(96,165,250,.13)}
.conv-st.done{color:var(--role-secretariat);background:rgba(201,164,234,.12)}
/* task197：等待中=亲自做模式下手下御史/子代理还在跑（黄，与 .conv-sub-st.wait 同色 #f5b043，零新增 hex） */
.conv-st.wait{color:#f5b043;background:rgba(245,176,67,.12)}
/* task274（主人 2026-11-14 口述）：运行中会话行左侧转圈圈（几何/动画对齐 DSH 左栏运行态） */
.conv-spin{flex:none;width:14px;height:14px;display:inline-block;color:var(--accent)}
.conv-sub .conv-spin{position:absolute;left:11px;top:50%;margin:-5px 0 0;width:10px;height:10px} /* task299：子行圈圈改绝对定位，与父行三角/圈圈同轴，不再挤占标签列 */
.conv-spin svg{width:100%;height:100%;display:block}
.conv-spin .spin-motion{transform-origin:center;animation:conv-spin-rot 1.5s linear infinite}
.conv-spin .spin-track,.conv-spin .spin-arc{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.conv-spin .spin-track{opacity:.25}
.conv-spin .spin-arc{stroke-dasharray:12 150;animation:conv-spin-dash 1.5s ease-in-out infinite}
@keyframes conv-spin-rot{to{transform:rotate(360deg)}}
@keyframes conv-spin-dash{0%{stroke-dasharray:12 150;stroke-dashoffset:0}50%{stroke-dasharray:24 150;stroke-dashoffset:-6}to{stroke-dasharray:12 150;stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.conv-spin .spin-motion,.conv-spin .spin-arc{animation:none}.conv-spin .spin-arc{stroke-dasharray:18 150;stroke-dashoffset:-3}}
.item.conv-child > .conv-spin{position:absolute;left:9px;top:50%;margin-top:-7px;transition:opacity .1s}
.item.conv-child.is-running > .caret{opacity:0;pointer-events:none;transition:opacity .1s}
/* task274：会话行悬停操作（⋯ 移动端常驻；桌面悬停：胶囊让位，⋯/归档/置顶出现，标题不被挤压） */
.conv-acts{display:flex;align-items:center;gap:2px;flex:none}
.conv-act{display:none;width:22px;height:22px;border-radius:6px;place-items:center;color:var(--faint);flex:none;padding:0;line-height:1} /* task282：padding:0 消除 UA button 默认内边距（1px 6px）对居中的干扰 */
.conv-act svg{width:14px;height:14px;display:block}
.conv-act-pin.on{color:var(--accent)}
@media (hover:hover) and (pointer:fine){
  .conv-acts{display:none}
  .item.conv-child:hover .conv-acts{display:flex}
  .item.conv-child:hover .item-more{display:grid}
  .item.conv-child:hover .conv-act{display:grid}
  .item.conv-child:hover .conv-mode,
  .item.conv-child:hover .conv-ctx,
  .item.conv-child:hover .conv-st{display:none}
  .item.conv-child.is-running:hover > .caret{opacity:1;pointer-events:auto}
  .item.conv-child.is-running:hover > .caret + .conv-spin{opacity:0}
  .conv-act:hover{background:#24282d;color:var(--text)}
  .conv-act-pin.on:hover{color:var(--accent-strong)}
}
/* task197：会话行链路模式徽标（仅大管家行；三色全部复用既有色变量/既有值） */
.conv-mode{font-size:9.5px;padding:0 5px;border-radius:999px;flex:none;line-height:1.6;white-space:nowrap;color:var(--sub);background:var(--card2)}
.conv-mode.m-direct{color:var(--sub);background:transparent}
.conv-mode.m-flat{color:#7cb3ff;background:rgba(96,165,250,.13)}
/* task189：会话行上下文百分比 pill（色档同顶部胶囊 ctxLevel；ctxp-* 独立类名防 L-048 全局色外溢） */
.conv-ctx,.conv-sub-ctx{font-size:9.5px;padding:0 5px;border-radius:999px;flex:none;line-height:1.6;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--faint);background:var(--card2)}
.conv-ctx.ctxp-warn,.conv-sub-ctx.ctxp-warn{color:#d8a13a;background:rgba(216,161,58,.12)}
.conv-ctx.ctxp-danger,.conv-sub-ctx.ctxp-danger{color:#e0533d;background:rgba(224,83,61,.14);font-weight:600}
.item .m{font-size:10.5px;color:var(--faint);flex:none}
.item .proj-ico{opacity:.55;font-size:12px;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center}
.item .proj-ico svg{width:13px;height:13px;display:block} /* task277：项目行图标换 SVG 线稿（与页签同一图标） */
.item .caret{width:16px;flex:none;color:var(--faint);font-size:12px;text-align:center;transition:transform .15s}
.item .caret.open{transform:rotate(90deg);color:var(--sub)}
/* task141：会话行三角改绝对定位——有无三角都由 padding-left 统一定位文字，彻底消除「无子会话行左移」（不再依赖占位元素） */
/* task277（主人 2026-11-14 口述）：会话行整行左移 22px（原 margin），左侧不再留黑缝；
   绿圈/三角 left:8/9 + 宽14/16 中心落在 16px = 项目行 caret 中心（padding 8 + 16/2），
   实现「绿圈在项目三角正下方」对齐；
   task277-fu1（主人复述「整个字左移、不要图标和『大管家』之间的空格」）：文字起点 55→30px，
   紧贴转圈右缘（9+14=23）留 7px；有三角时右缘 24 留 6px。 */
.item.conv-child{position:relative;padding-left:30px}
.item.conv-child .caret{position:absolute;left:8px;top:50%;margin-top:-8px;width:16px;line-height:16px}
.item.conv-child .caret.open{transform:rotate(90deg)}
/* task141：会话排序模式——行内 ↑↓ 与项目行「完成」 */
.sort-mv{flex:none;width:26px;height:26px;border-radius:7px;font-size:13px;line-height:1;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);color:var(--sub)}
.sort-mv:hover{border-color:var(--line2);color:var(--text)}
.sort-mv:active{background:var(--accent-soft);color:var(--accent)}
.sort-done{flex:none;padding:4px 12px;border-radius:8px;background:var(--accent);color:#07130d;font-size:11.5px;font-weight:650;line-height:1.35;white-space:nowrap}
.sort-done:hover{background:var(--accent-strong)}
.item.proj-row[draggable="true"]{cursor:grab}
.item.proj-row[draggable="true"]:active{cursor:grabbing}
.item.dragging{opacity:.4}
/* 拖拽预览：浏览器默认快照在深色底下呈惨白虚影（主人 2026-11-09 实拍「太吓人」），改用深色自绘卡片 */
.drag-ghost{position:fixed;left:-9999px;top:0;display:flex;align-items:center;gap:6px;max-width:220px;padding:6px 12px;border-radius:9px;background:#1a1c1f;border:1px solid rgba(52,201,139,.45);color:var(--text);font-size:12.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.item.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.item.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.item.conv-child{margin:0;padding:3px 8px 3px 30px;position:relative} /* task277-fu1：主人要文字栏贴紧转圈（去掉图标与「大管家」之间的空格）→ padding-left 55→30（圈右缘23/三角右缘24，留 6~7px） */
.item.conv-child .t{font-size:12.5px}
.item.conv-child .m{font-size:10px}
/* task54 B：会话树懒加载子行（task299 起 lv1=0px / lv2=12px / lv3=24px，层级差 12px 保留）
   task192：竖向密度收紧——主人反馈边栏内容多、子行要更紧凑：行高 26→22px、上下内边距 4→1px、
   行间距 1→0、字号 11.5→11px、徽标/状态 10→9.5px（只收竖向与字号，层级缩进原样保留）
   task299（主人 2026-11-14 截图「这个御史的 UI 也要左对齐」）：子行左缘归 0、padding-left 30px——
   与父会话行文字列（task277-fu1 的 30px）严格同列；caret/圈圈绝对定位到 8/11px，层级缩进只留在外层 margin。 */
.conv-sub{position:relative;display:flex;align-items:center;gap:4px;margin:0;padding:1px 8px 1px 30px;border-radius:7px;cursor:pointer;font-size:11px;color:var(--sub);min-height:22px;line-height:1.3} /* task197：右内边距 6→8px，与 .item.conv-child 右内边距对齐=状态标签同列 */
@media (hover:hover) and (pointer:fine){ .conv-sub:hover{background:#1a1d21} .conv-sub.is-running.has-caret:hover > .conv-sub-caret{opacity:1;pointer-events:auto} .conv-sub.is-running.has-caret:hover > .conv-spin{opacity:0} } /* task299：运行中悬停可换回三角（仅可展开行；叶子御史行保持圈圈） */
.conv-sub.lv2{margin-left:12px}
.conv-sub.lv3{margin-left:24px}
.conv-sub.active{background:var(--accent-soft);color:var(--text)}
.conv-sub.focus{outline:1px solid var(--accent);outline-offset:1px} /* task164：原 .navtask.focus 描边随任务行退役迁到这里（右栏任务面板跳转高亮） */
.conv-sub.loading,.conv-sub.failed{cursor:default;color:var(--faint)}
.conv-sub .conv-sub-caret{position:absolute;left:8px;top:50%;margin-top:-8px;width:16px;font-size:10px;color:var(--faint);text-align:center;line-height:16px}
.conv-sub.is-running > .conv-sub-caret{opacity:0;pointer-events:none;transition:opacity .1s} /* task299：与父行同一套「运行中圈圈占位、悬停换回三角」语义 */
.conv-sub .conv-sub-tag{flex:none;font-size:9.5px;padding:0 4px;border-radius:4px;line-height:1.35}
/* task184：派单角色丢失红标（要求 X 实际 Y=全工具）——只显示不动作，透明底+红描边（不复用 .role-* 背景，L-048） */
.conv-sub .conv-sub-tag.mismatch{color:var(--err);background:transparent;border:1px solid var(--err)}
/* 角色色板类（task70 S3-3；颜色唯一来源=:root 变量，此处只引用） */
.role-steward{color:var(--role-steward);background:var(--role-steward-bg)}
.role-secretariat{color:var(--role-secretariat);background:var(--role-secretariat-bg)}
.role-writer{color:var(--role-writer);background:var(--role-writer-bg)}
.role-censor-ds{color:var(--role-censor-ds);background:var(--role-censor-ds-bg)} /* task265 退役类：历史会话兜底 */
.role-censor-glm{color:var(--role-censor-glm);background:var(--role-censor-glm-bg)} /* task265 退役类：历史会话兜底 */
.role-censor-plan{color:var(--role-censor-plan);background:var(--role-censor-plan-bg)}
.role-censor-output{color:var(--role-censor-output);background:var(--role-censor-output-bg)}
.role-butler{color:var(--role-butler);background:var(--role-butler-bg)}
.role-aux{color:var(--role-aux);background:var(--role-aux-bg)}
.role-unknown{color:var(--role-unknown);background:var(--role-unknown-bg)}
.conv-sub .conv-sub-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-sub .conv-sub-st{flex:none;font-size:9.5px;color:var(--faint);padding:0 5px;border-radius:999px;line-height:1.6;white-space:nowrap;background:var(--card2)}
.conv-sub .conv-sub-st.live{color:var(--accent);background:var(--accent-soft)}
.conv-sub .conv-sub-st.wait{color:#f5b043;background:rgba(245,176,67,.12)}
/* task190：异常态分色——已中断红、疑似中断橙红（复用 --err 与既有 #e0533d，零新增 hex）；静默沿用默认灰 */
.conv-sub .conv-sub-st.inter{color:var(--err);background:rgba(255,107,107,.12)}
.conv-sub .conv-sub-st.stall{color:#e0533d;background:rgba(224,83,61,.14)}
/* task199（主人 2026-11-10 定）：子行「已完成」由默认灰改淡紫，与根行 .conv-st.done 同色（复用 --role-secretariat 零新增 hex）；

.qcard{position:relative;max-width:800px;margin:0 auto 9px;border:1px solid rgba(52,201,139,.35);background:rgba(52,201,139,.07);border-radius:14px;padding:12px 14px}

/* task318：待机语音条（对齐 DAG AI Chat 0.499「一栏双态」）——输入框空且未聚焦时盖在输入框上：
   轻点=进文字态弹键盘，长按 300ms=起录（松手发送、上滑取消）。只在手机端出现（isMobile 判定） */
/* task327（主人 2026-11-15「＋往下沉」复核抓出的真根因）：textarea 是 inline-block，在
   .inputwrap 里产生行内基线空隙 ≈7.6px（line-height normal × 字号 14.5）——wrap 高 43.6 ≠
   textarea 36，holdmode composer-bar 的 bottom:4px 贴 inner 底，被空隙抬高差值 → ＋ 中心比
   待机条中心低 7.6px（CDP 390×844 实测：inputCenter 788.8 vs plusCenter 796.4）。
   结构式根治：wrap 改 flex，textarea 成 flex item 无基线空隙，wrap 高=36=textarea 高，
   两模式（待机/文字）行盒同时归位。L-109：几何链=wrap(h36) + inner pb4 + bar bottom4 → 同底。 */
.inputwrap{position:relative;display:flex}
.holdbar{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1.2;color:var(--sub);border-radius:10px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;cursor:text}

.holdbar .hb-dot{width:8px;height:8px;border-radius:50%;background:#ff6b6b;flex:none;animation:voicePulse 1.1s ease-in-out infinite}
.holdbar.cancel{color:#ff5b5b}

/* 待机条盖住输入框时吃掉占位符（防「今天帮你做些什么？」与条子文字重叠） */

.restmode:hover{border-color:var(--line2);color:var(--text)}

/* task327（主人 2026-11-15 定版）：附件三瓷砖面板退役——系统选择面板已含相册/拍照/文件，
   自绘中间层多此一举；点 ＋ 直接弹 #filePickInput（无 accept，系统面板）。恢复路径见任务牌 task327。 */
/* task321（主人 2026-11-15）：「默认只有一行，下面这一排都不要显示」——手机端待机（按住说话条可见、
   输入框空且未聚焦）时收成一排：＋ 留在最左，中间待机条，☾/☰/模型/🎙/↑ 一并收起；
   轻点进文字态后整条工具行恢复。
   task324（主人 2026-11-15）：①「语音输入框要整个居中，不是去掉发送按钮后居中（那样偏右难看）」——
   ＋ 改绝对定位浮在左下角，待机条占满整行 → 文案真正居中于整行；
   ②「发了图片，不管语音模式还是文本模式都应该直接加载在上面」——有附件（body.has-attach，
   renderAtts 增删/发送时同步）时缩略行照常显示在待机条上方，不再等切到文本模式 */

/* task206：大屏弹出模式（?popout=pricing 独立窗口）——只有右栏一列，页签行隐藏。
   特异度：body.popout #right = (1,1,1)，压过 ≤940px 媒体查询裸 #right (1,0,0) 的 fixed/display:none；
   body.popout #app = (1,1,1) 亦压过 #app.noright (1,1,0)，grid 无需重复声明（fu2 撤冗余条，御史 P2-1 正字） */
body.popout #app{grid-template-columns:minmax(0,1fr)}
body.popout #sidebar,body.popout #main{display:none}
body.popout .splitter{display:none} /* fu2：单列页无列可拖，隐藏 phantom 分隔条（御史 P2-2） */
body.popout #right{border-left:none;display:flex;position:static;inset:auto}
body.popout #app.noright #right{display:flex} /* fu1/fu2 正字：#app.noright #right{display:none} (2,1,0) 由本条 (2,2,1) 反压——黑屏根因；bootPopout 另运行时摘 noright 双保险 */
body.popout .tabs{display:none}
/* task370：大屏页数据区撑满视口——主人「模型对比下面那么一大坨黑色空间被挤占，能否取消」（task211 后又复发）。
   根因：task211 靠 popoutFitOnce 的 window.resizeTo 收窗高，但浏览器把 ?popout=pricing 并成普通标签页/用户手动拉大窗口时
   resizeTo 被宿主忽略，窗口恢复原高即露出整片空白；且 task350 删 popout max-height 特例后表格盒按内容定高，空白更明显。
   修法改为纯布局兜底（不依赖窗口尺寸）：rightBody 竖向 flex 撑满，#pricingWrap 吃满剩余高，#pricingWrapBox 弹性填满并内部滚动——
   数据少时表格区一直延伸到窗口底部、说明行贴底，下方不再有断层黑块；数据多时仍是盒内滚 + 表头 sticky（task350 口径不变）。
   apikey 页的 .pr-panel 显式 flex:none，保持内容自然高度不拉伸。 */
body.popout #rightBody{display:flex;flex-direction:column}

/* P2：右上角常驻胶囊（task38：内存/余额/额度/活跃任务速览；数据源 /_watch + 既有 fetchBalance + 智谱 quota 低频轮询） */
.syswrap{position:relative;flex:none;display:flex;align-items:center;gap:6px}
.syspill{display:flex;align-items:center;font-size:11px;color:var(--sub);background:#17191d;border:1px solid var(--line);border-radius:99px;padding:4px 11px;cursor:pointer;white-space:nowrap;max-width:42vw;overflow:hidden}
.syspill:hover{color:var(--text);border-color:var(--line2)}
.syspill .sp-sep{color:var(--faint);margin:0 5px}
.syspanel{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:264px;background:#141619;border:1px solid var(--line2);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.45);padding:10px 12px;font-size:11.5px;color:var(--sub)}
.syspanel h4{font-size:10.5px;color:var(--faint);margin:9px 0 4px;font-weight:600}
.syspanel h4:first-child{margin-top:0}
.sysrow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:18px}
.sysrow b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sysbar{height:5px;border-radius:99px;background:#22262b;overflow:hidden;margin:5px 0 2px}
.sysbar i{display:block;height:100%;background:linear-gradient(90deg,#38d99a,#e0b341,#ff6b6b)}
/* task119 合并单：效率统计区块（面板可滚 + 纯 CSS div 柱条，零新依赖零动画；柱色复用既有 #38d99a） */
.syspanel{max-height:calc(100vh - 76px - env(safe-area-inset-top));overflow-y:auto}
.stat-chart{display:flex;align-items:flex-end;gap:2px;height:72px;margin:6px 0 2px}
.stat-bar{flex:1;min-height:2px;border-radius:2px 2px 0 0;background:var(--line2)} /* 零数据日 2px 灰线占位 */
.stat-bar.on{background:#38d99a}
.stat-x{display:flex;gap:2px;color:var(--faint);font-size:9.5px}
.stat-x span{flex:1;text-align:left;white-space:nowrap;overflow:visible}
.stat-note{color:var(--faint);font-size:10px;margin-top:6px;line-height:1.5}
/* task121：内存面板进程区块（色值全走 var(--*)；警示红复用既有 sysbar 渐变同值 #ff6b6b，非新增色） */
.proc-list{max-height:156px;overflow-y:auto;overscroll-behavior:contain;margin-top:2px} /* task122-fu1：只露约 7 行，表内滚动看全部，面板高度可控 */
.proc-row{gap:6px;min-height:22px}
.proc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.proc-meta{display:flex;align-items:center;gap:6px;flex:none}
.proc-kill{font-size:10px;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:6px;padding:1px 7px;cursor:pointer;flex:none}
.proc-kill:hover:not(:disabled):not(.proc-kill-armed){color:var(--text);border-color:var(--line2)} /* 御史P1-4：hover 排除武装态，防(0,3,0)压过(0,1,0)让警示红永不出现 */
.proc-kill:disabled{cursor:default;opacity:.55}
.proc-kill-armed{color:#ff6b6b;border-color:#ff6b6b}
.syspill-x{display:none} /* task120：拆分胶囊默认隐藏（与 .syspill 同特异性后置覆盖；单断点 1121 判定，杜绝 1120~1121 分数宽度双显死区） */
.syspill.warn{color:#ffb84d;border-color:#a86b1e} /* task126 F2'B：任务胶囊超时态（暖色警示，纯着色零布局） */
.msg.sysnudge .bubble{border-style:dashed;opacity:.92} /* task126 P0-1②：程序注入消息弱化（虚线边+轻降透明度，内容照常可读） */
.msg .who .sysname{color:var(--faint);font-weight:normal}
@media (min-width:1121px){.syspill-x{display:flex}#sysPill{display:none}} /* task120：PC 显示四拆分胶囊、隐藏合一胶囊 */
@media (max-width:1120px){.syspill .sp-m,.syspill .sp-b,.syspill .sp-q,.syspill .sp-x{display:none}}
/* P0-5 对照实验开关：控制台执行 document.documentElement.classList.add('blur-off') 可临时关闭五处毛玻璃，
   用于验证鼠标闪烁是否与鸿蒙 PWA 的 backdrop-filter 合成有关；结论回报后本段整体删除 */
html.blur-off #topbar,html.blur-off #btnScrollDown,html.blur-off #btnScrollUp,html.blur-off #overlay,html.blur-off #usageStats,html.blur-off #panelMask{backdrop-filter:none!important}
/* ---------- 任务清单 dock（移植 DSH TodoDock，2026-11-14；rev.2 收窄到与输入框同宽 800px + 精致化） ---------- */
.tododock{padding:0 24px;margin:0 0 6px}
.tododock .tdock{max-width:800px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.22)}
.tdock-head{display:flex;align-items:center;gap:8px;width:100%;padding:8px 13px;background:transparent;border:0;color:var(--sub);font:inherit;font-size:12px;cursor:pointer;text-align:left}
.tdock-head:hover{background:rgba(255,255,255,.032)}
.tdock-ico{color:var(--accent);opacity:.9;flex:none;font-size:13px;line-height:1}
.tdock-title{color:var(--text);flex:none;font-weight:600;letter-spacing:.2px}
.tdock-progress{display:flex;align-items:center;flex:1;min-width:0;overflow:hidden;white-space:nowrap;font-size:11.5px;font-variant-numeric:tabular-nums}
.tdock-progress b{font-weight:500;color:var(--faint)}
.tdock-progress b+b::before{content:'·';margin:0 6px;color:var(--line2)}
.tdock-done{color:var(--accent)!important}
.tdock-active{color:#e8a23d!important}
.tdock-pending{color:var(--faint)!important}
.tdock-chev{color:var(--faint);flex:none;font-size:10px;transition:transform .16s}
.tdock-list{list-style:none;margin:0;padding:6px 13px 10px;max-height:210px;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line)}
.tdock-item{display:flex;align-items:center;gap:9px;font-size:12px;line-height:21px;color:var(--sub);min-width:0}
.tdock-dot{flex:none;width:6px;height:6px;border-radius:99px;background:var(--faint);box-shadow:0 0 0 3px transparent}
.tdock-item.tdock-completed .tdock-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(52,201,139,.1)}
.tdock-item.tdock-in_progress .tdock-dot{background:#e8a23d;box-shadow:0 0 0 3px rgba(232,162,61,.14)}
.tdock-item.tdock-completed .tdock-content{color:var(--faint);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.16);text-decoration-thickness:1px}
.tdock-item.tdock-in_progress .tdock-content{color:var(--text)}
.tdock-content{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:940px){.tododock{padding:0 8px}}

(function(){
  var ATTR="lj-scroll-hide-chrome";
  var root=document.documentElement;
  var HIDE_ACC=26,TOP_ZONE=6,IGNORE_MS=320,GESTURE_MS=1200,LOCK_MS=1500;
  var hidden=false,lastTop=0,acc=0,ignoreUntil=0,lockUntil=0,lastIntent=-1e9;
  function now(){ return performance.now() }
  function msgs(){ return document.getElementById("messages") }
  function narrow(){ return window.innerWidth<=900 }
  function setHidden(next){
    if(next&&!narrow()) next=false;
    if(next===hidden) return;
    hidden=next;
    if(next) ignoreUntil=now()+IGNORE_MS; else acc=0;
    root.classList.toggle(ATTR,hidden);
  }
  function onScroll(){
    var el=msgs(); if(!el) return;
    var t=now(),top=el.scrollTop,dy=top-lastTop;
    lastTop=top;
    if(!narrow()){ if(hidden) setHidden(false); return }
    if(t<ignoreUntil||t<lockUntil) return;
    if(top<=TOP_ZONE){ acc=0; setHidden(false); return }
    if(t-lastIntent>GESTURE_MS) return;
    if(dy>0){ acc=acc>0?acc+dy:dy; if(acc>=HIDE_ACC){ acc=0; setHidden(true) } }
    else if(dy<0){ acc=0; setHidden(false) }
  }
  function mark(){ lastIntent=now() }
  document.addEventListener("touchstart",mark,{capture:true,passive:true});
  document.addEventListener("touchmove",mark,{capture:true,passive:true});
  document.addEventListener("wheel",mark,{capture:true,passive:true});
  document.addEventListener("scroll",function(e){ var t=e.target; if(t&&t.id==="messages") onScroll() },{capture:true,passive:true});
  document.addEventListener("focusin",function(e){
    var t=e.target;
    if(t&&t.closest&&t.closest("#composer")) setHidden(false);
  },true);
  document.addEventListener("pointerdown",function(e){
    var t=e.target;
    if(!t||!t.closest) return;
    if(t.closest("#composer")){ lockUntil=now()+LOCK_MS; setHidden(false); return }
    if(hidden&&!t.closest("#messages")) setHidden(false);
  },{capture:true,passive:true});
  window.addEventListener("resize",function(){ if(!narrow()) setHidden(false) });
  window.__ljScrollHide={hidden:function(){ return hidden },force:function(v){ setHidden(v!==false) }};
})();
